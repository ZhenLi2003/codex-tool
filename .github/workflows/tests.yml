name: codex-tool tests

on:
  push:
    branches: [main, feat/background-reconciliation-v2.2]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax
        run: |
          bash -n codex-tool
          bash -n codex-launcher
          bash -n install.sh
      - name: Offline manual-download tests
        run: bash tests/test_downloads.sh
      - name: Python dependency for background v2 tests
        run: python3 -m pip install --user 'tomlkit==0.13.3'
      - name: Python syntax and behavior
        run: |
          python3 -m py_compile background.py background_v2.py
          python3 -m unittest discover -s tests -v
